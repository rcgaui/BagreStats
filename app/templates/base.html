<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}BagreStats{% endblock %}</title>
<style>
  :root{--bg:#12151a;--card:#1b1f27;--linha:#262b35;--txt:#e7ebf0;--fraco:#8b95a5;
        --verde:#2ecc71;--amarelo:#f1c40f;--vermelho:#e74c3c;--acento:#3ba55d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--linha);padding:0 16px;
         position:sticky;top:0;z-index:10}
  nav{max-width:900px;margin:0 auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  nav .marca{font-weight:700;margin-right:16px;padding:14px 0;letter-spacing:-.3px}
  nav .marca span{color:var(--acento)}
  nav a{color:var(--fraco);text-decoration:none;padding:14px 12px;font-size:14px;
        border-bottom:2px solid transparent}
  nav a:hover{color:var(--txt)}
  nav a.ativo{color:var(--txt);border-bottom-color:var(--acento)}
  main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--fraco);font-size:13px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:10px;
        overflow:hidden;margin-bottom:16px}
  .card h2{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--linha);
           color:var(--fraco);text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:right;color:var(--fraco);font-size:11px;text-transform:uppercase;
     letter-spacing:.5px;padding:10px 8px;border-bottom:1px solid var(--linha);font-weight:600}
  th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
  td{padding:11px 8px;border-bottom:1px solid var(--linha);text-align:right}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#20252e}
  td a{color:var(--txt);text-decoration:none;font-weight:500}
  td a:hover{color:var(--acento)}
  .pos{color:var(--fraco);width:32px;font-variant-numeric:tabular-nums}
  .pts{font-weight:700}
  .barra{display:inline-block;width:52px;height:5px;background:var(--linha);
         border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px}
  .barra i{display:block;height:100%;background:var(--acento)}
  .bola{display:inline-block;width:11px;height:11px;border-radius:50%;
        vertical-align:-1px;margin-right:7px;border:1px solid #0006}
  .vazio{padding:28px 16px;color:var(--fraco);text-align:center;font-size:14px}
  form{padding:16px}
  label{display:block;font-size:12px;color:var(--fraco);margin:0 0 6px;
        text-transform:uppercase;letter-spacing:.5px}
  input,select,button{font:inherit;border-radius:7px;border:1px solid var(--linha);
                      background:#141820;color:var(--txt);padding:9px 11px}
  input[type=color]{padding:3px;height:38px;width:52px}
  button{background:var(--acento);border-color:var(--acento);color:#fff;font-weight:600;
         cursor:pointer;padding:10px 18px}
  button:hover{filter:brightness(1.1)}
  button.fraco{background:transparent;border-color:var(--linha);color:var(--fraco)}
  .linha-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
  .erro{background:#3a1f22;border:1px solid #6b2b31;color:#ffb3b8;padding:11px 14px;
        border-radius:8px;margin-bottom:16px;font-size:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:620px){.grid2{grid-template-columns:1fr}}
  .destaque{display:flex;gap:24px;padding:16px;flex-wrap:wrap}
  .destaque div{flex:1;min-width:88px}
  .destaque b{display:block;font-size:26px;font-weight:700;letter-spacing:-1px}
  .destaque small{color:var(--fraco);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .V{color:var(--verde)}.E{color:var(--amarelo)}.D{color:var(--vermelho)}
  .selo{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;
        border-radius:4px;font-size:11px;font-weight:700;margin-right:3px}
  .selo.V{background:#1e4d33;color:#5fd68f}
  .selo.E{background:#4d431e;color:#e8c95f}
  .selo.D{background:#4d2222;color:#f08a80}
  /* --- avatar: circulo com as iniciais, cor derivada do proprio apelido --- */
  .quem{display:flex;align-items:center;gap:10px}
  .av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
      font-size:11px;font-weight:700;color:#0d0f13;letter-spacing:-.2px}
  .av.g{width:56px;height:56px;font-size:20px}
  /* --- podio: as tres primeiras posicoes --- */
  .pos.m1{color:#f5c451;font-weight:700}
  .pos.m2{color:#c9d1d9;font-weight:700}
  .pos.m3{color:#cd8b52;font-weight:700}
  tr.top td{background:linear-gradient(90deg,#1f2630 0%,transparent 55%)}
  /* --- graficos --- */
  .gr{padding:16px}
  .gr svg{display:block;width:100%;height:auto;overflow:visible}
  .gr .grade{stroke:var(--linha);stroke-width:1}
  .gr .curva{fill:none;stroke:var(--acento);stroke-width:2.5;
             stroke-linejoin:round;stroke-linecap:round}
  .gr .sombra{fill:var(--acento);opacity:.12}
  .gr .no{fill:var(--card);stroke:var(--acento);stroke-width:2.5}
  .gr .marca-y{fill:var(--fraco);font-size:10px}
  .gr .marca-x{fill:var(--fraco);font-size:10px;text-anchor:middle}
  /* --- barra empilhada V/E/D --- */
  .pilha{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--linha)}
  .pilha i{display:block}
  .pilha .v{background:var(--verde)} .pilha .e{background:var(--amarelo)}
  .pilha .d{background:var(--vermelho)}
  /* Na barra de confronto quem pinta e a cor do colete, nao o julgamento de
     bom/ruim: ali nao existe lado certo. O contorno interno impede que uma
     cor escura como o preto suma no fundo escuro. */
  .pilha.coletes i{box-shadow:inset 0 0 0 1px #ffffff26}
  .legenda .colete::before{background:var(--c)}
  .legenda{display:flex;gap:16px;margin-top:11px;font-size:12px;color:var(--fraco);flex-wrap:wrap}
  .legenda b{color:var(--txt);font-weight:600}
  .legenda span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;
                        margin-right:6px;vertical-align:0}
  .legenda .v::before{background:var(--verde)}
  .legenda .e::before{background:var(--amarelo)}
  .legenda .d::before{background:var(--vermelho)}
  /* --- confronto: barra com as duas cores --- */
  .duelo{padding:14px 16px;border-bottom:1px solid var(--linha)}
  .duelo:last-child{border-bottom:none}
  .duelo .topo{display:flex;justify-content:space-between;align-items:center;
               margin-bottom:9px;font-size:14px}
  .duelo .placar{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.5px}
  .duelo .conta{color:var(--fraco);font-size:12px;font-weight:400}

  /* --- lancar pelada: os dois cartoes de resumo (Q3: um time por vez) --- */
  .resumo-times{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  @media(max-width:560px){.resumo-times{grid-template-columns:1fr}}
  .cartao-time{border:1px solid var(--linha);border-radius:9px;background:#171b23;
               padding:14px;text-align:left;cursor:pointer;color:var(--txt);width:100%;
               display:flex;flex-direction:column;gap:8px;font:inherit}
  .cartao-time:hover{border-color:var(--acento)}
  .cartao-time .titulo{display:flex;align-items:center;justify-content:space-between;
                        font-size:13px;color:var(--fraco)}
  .cartao-time .titulo b{color:var(--txt);display:flex;align-items:center;gap:7px}
  .cartao-time .conta{font-size:22px;font-weight:700}
  .cartao-time .conta small{font-size:12px;color:var(--fraco);font-weight:400}
  .cartao-time select{width:100%}

  /* --- editor de escalacao: o campinho --- */
  .editor-time{border:1px solid var(--linha);border-radius:10px;background:var(--card);
               padding:16px;margin-bottom:16px}
  .editor-time .topo-editor{display:flex;align-items:center;justify-content:space-between;
                             margin-bottom:14px}
  .editor-time .topo-editor h2{margin:0;padding:0;border:none;font-size:15px;
                                text-transform:none;letter-spacing:0;color:var(--txt)}
  .campo{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:3/4;
         background:linear-gradient(#2a7a3f,#256b38);border:2px solid #ffffff40;
         border-radius:10px;overflow:hidden}
  .campo::before{content:"";position:absolute;inset:0;
                 background:repeating-linear-gradient(0deg,#ffffff0d 0 12%,transparent 12% 24%)}
  .campo::after{content:"";position:absolute;left:50%;top:0;width:34%;height:11%;
                border:2px solid #ffffff55;border-top:none;transform:translateX(-50%);
                border-radius:0 0 6px 6px}
  .vaga{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
        align-items:center;gap:3px;background:none;border:none;padding:0;cursor:pointer;
        font:inherit;color:inherit}
  .vaga .bolha{width:44px;height:44px;border-radius:50%;background:#ffffff26;
               border:2px dashed #ffffff70;display:grid;place-items:center;
               font-size:18px;color:#fff;transition:background .15s}
  .vaga .bolha:hover{background:#ffffff3d}
  .vaga.ocupada .bolha{background:var(--card);border-style:solid;border-color:#fff}
  .vaga .rotulo{font-size:10px;color:#ffffffcc;text-shadow:0 1px 2px #000a;
                white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
  .reservas{margin-top:16px}
  .reservas .rotulo-secao{font-size:11px;color:var(--fraco);text-transform:uppercase;
                          letter-spacing:.5px;margin-bottom:9px}
  .lista-reservas{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .lista-reservas .vaga{position:static;transform:none}
  .lista-reservas .vaga .bolha{background:#ffffff14;border-color:var(--linha)}
  .lista-reservas .vaga.ocupada .bolha{background:#20252e;border-color:var(--acento);
                                        border-style:solid}
  .lista-reservas .vaga .rotulo{color:var(--fraco);text-shadow:none}
  .add-reserva .bolha{border-style:solid;border-color:var(--linha);color:var(--fraco)}
  .add-reserva:hover .bolha{border-color:var(--acento);color:var(--acento)}

  /* --- popup de escolha de jogador --- */
  .popup-fundo{position:fixed;inset:0;background:#000a;display:flex;
              align-items:flex-end;justify-content:center;z-index:100;padding:0}
  /* CSS de autor sempre vence o atributo [hidden] do navegador quando a
     mesma regra ja define display - por isso precisa deste override
     explicito, senao o popup nasce visivel mesmo com hidden no HTML. */
  .popup-fundo[hidden]{display:none}
  @media(min-width:560px){.popup-fundo{align-items:center}}
  .popup-caixa{background:var(--card);width:100%;max-width:380px;max-height:74vh;
              border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
  @media(min-width:560px){.popup-caixa{border-radius:12px;max-height:70vh}}
  .popup-caixa .cabeca{padding:14px 16px;border-bottom:1px solid var(--linha)}
  .popup-caixa .cabeca-linha{display:flex;justify-content:space-between;align-items:center;
                              margin-bottom:10px}
  .popup-caixa h3{margin:0;font-size:14px;color:var(--fraco);text-transform:uppercase;
                  letter-spacing:.5px}
  .popup-caixa .fechar{background:none;border:none;color:var(--fraco);font-size:20px;
                       cursor:pointer;padding:0;line-height:1}
  .popup-caixa input[type=search]{width:100%}
  .popup-lista{overflow-y:auto;flex:1}
  .popup-lista button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
                      padding:11px 16px;background:none;border:none;border-top:1px solid var(--linha);
                      color:var(--txt);font:inherit;cursor:pointer}
  .popup-lista button:hover{background:#20252e}
  .popup-lista .vazio{padding:20px 16px;color:var(--fraco);font-size:13px}
  .remover-jogador{margin:0;padding:11px 16px;background:none;border:none;
                   border-top:1px solid var(--linha);color:var(--vermelho);font:inherit;
                   text-align:left;cursor:pointer;width:100%}
  .remover-jogador:hover{background:#20252e}

</style>
</head>
<body>
<header><nav>
  <div class="marca">Bagre<span>Stats</span></div>
  <a href="/" class="{{ 'ativo' if pagina=='tabela' }}">Classificação</a>
  <a href="/lancar" class="{{ 'ativo' if pagina=='lancar' }}">Lançar pelada</a>
  <a href="/confrontos" class="{{ 'ativo' if pagina=='confrontos' }}">Confrontos</a>
  <a href="/jogadores" class="{{ 'ativo' if pagina=='jogadores' }}">Elenco</a>
</nav></header>
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
